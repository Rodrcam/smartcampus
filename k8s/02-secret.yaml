# Credenciales de PostgreSQL, que usan tanto la base de datos como el backend.
#
# Los valores de "data" están en base64. Base64 es una CODIFICACIÓN, no un
# cifrado: cualquiera que lea este fichero (o que tenga permiso para leer
# Secrets en el clúster) puede recuperarlos, por ejemplo con:
#   kubectl get secret smartcampus-db-secret -n smartcampus -o jsonpath='{.data.DB_PASSWORD}' | base64 -d
#
# Lo dejamos en el repositorio porque es una práctica con un clúster local y
# una contraseña de laboratorio. En un proyecto real este fichero NO se subiría
# a Git: el Secret se crearía directamente en el clúster (kubectl create secret)
# o con herramientas como Sealed Secrets, External Secrets + HashiCorp Vault o
# el gestor de secretos del proveedor cloud.
apiVersion: v1
kind: Secret
metadata:
  name: smartcampus-db-secret
  namespace: smartcampus
type: Opaque
data:
  DB_USER: c21hcnRjYW1wdXM=
  DB_PASSWORD: U21hcnRDYW1wdXMtSzhzLTIwMjY=
