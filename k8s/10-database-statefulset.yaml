# PostgreSQL como StatefulSet y no como Deployment, porque es un servicio con
# estado:
#  - El Pod tiene un nombre estable (database-0) que no cambia al recrearlo.
#  - Cada réplica tiene su propio volumen (PersistentVolumeClaim), creado a
#    partir de volumeClaimTemplates, que se conserva aunque el Pod se borre.
#  - Los Pods se crean y se borran en orden, de uno en uno.
# Un Deployment está pensado para Pods intercambiables y sin estado, como el
# backend.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: smartcampus
  labels:
    app: database
spec:
  serviceName: database-headless
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: smartcampus-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: smartcampus-db-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartcampus-db-secret
                  key: DB_PASSWORD
            # Los datos van en un subdirectorio del volumen: en algunos
            # entornos la raíz del volumen trae una carpeta lost+found y
            # PostgreSQL se niega a inicializar un directorio que no está vacío.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # Lista para recibir tráfico cuando acepta conexiones TCP
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          # Si deja de responder durante 1 minuto, Kubernetes reinicia el contenedor
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: init-scripts
          configMap:
            name: database-init
  # Kubernetes crea un PersistentVolumeClaim por réplica (data-database-0)
  # usando la StorageClass por defecto del clúster.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
