# Interfaz web: nginx sirve la página y reenvía /api/... al backend-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smartcampus
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: smartcampus-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: smartcampus-config
                  key: BACKEND_URL
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: smartcampus-config
                  key: APP_ENV
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
