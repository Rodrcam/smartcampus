# Expone el frontend fuera del clúster con un NodePort: se puede abrir en
# http://<IP del nodo>:30080. Con Minikube basta con:
#   minikube service frontend-service -n smartcampus
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: smartcampus
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
